name: Daily LLM Freshness & Transition Audit

on:
  schedule:
    - cron: '30 23 * * *' # Every day 08:30 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  freshness-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Run Org Memory & LLM Pricing Freshness Audit
        id: freshness
        shell: bash
        run: |
          set +e
          OUTPUT=$(node scripts/audit-org-memory.mjs --docs-only --time-sensitive 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          {
            echo "audit_output<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if echo "$OUTPUT" | grep -q '\[Pricing Warning\]'; then
            echo "has_warning=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_warning=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify via AI Issue on Failure or Upcoming Price Transition
        if: steps.freshness.outputs.exit_code != '0' || steps.freshness.outputs.has_warning == 'true'
        uses: actions/github-script@v7
        env:
          AUDIT_EXIT_CODE: ${{ steps.freshness.outputs.exit_code }}
          AUDIT_HAS_WARNING: ${{ steps.freshness.outputs.has_warning }}
          AUDIT_OUTPUT: ${{ steps.freshness.outputs.audit_output }}
        with:
          script: |
            const exitCode = process.env.AUDIT_EXIT_CODE || '1'
            const hasWarning = process.env.AUDIT_HAS_WARNING === 'true'
            const auditOutput = process.env.AUDIT_OUTPUT || ''
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const TRUSTED_ASSOC = new Set(['OWNER', 'COLLABORATOR', 'MEMBER'])
            const isTrustedAiIssue = (i) => {
              if (i.pull_request) return false
              const hasAiLabel = (i.labels || []).some(
                (l) => (typeof l === 'string' ? l : l.name) === 'owner:ai'
              )
              if (!hasAiLabel) return false
              const assoc = String(i.author_association || '').toUpperCase()
              if (TRUSTED_ASSOC.has(assoc)) return true
              return (
                i.user?.type === 'Bot' &&
                i.user?.login === 'github-actions[bot]'
              )
            }

            const openIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'owner:ai',
              per_page: 100,
            })

            if (exitCode !== '0') {
              const titlePrefix = '[AI] 日次鮮度監査エラー：LLMモデル・価格情報の公式確認＆更新が必要'
              const exists = openIssues.data.some((i) => isTrustedAiIssue(i) && i.title.startsWith(titlePrefix))
              if (!exists) {
                const body = [
                  '日次鮮度監査（`scripts/audit-org-memory.mjs --docs-only --time-sensitive`）が失敗しました。',
                  '',
                  '### 検出内容',
                  '```text',
                  auditOutput,
                  '```',
                  '',
                  `- Run URL: ${runUrl}`,
                  '- 対応方法: 各社公式料金表をWeb検索で一次確認し、`src/data/llm-pricing.ts` の最新モデル・単価・`PRICING_LAST_VERIFIED`・`priceEffectiveUntil` を更新してください。',
                ].join('\n')
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `${titlePrefix} (${new Date().toISOString().slice(0, 10)})`,
                  body,
                  labels: ['owner:ai', 'type:tool', 'status:ready', 'priority:p0'],
                })
              }
            } else if (hasWarning) {
              const titlePrefix = '[AI] 価格改定予定の事前検知：LLM料金テーブルの公式確認'
              const exists = openIssues.data.some((i) => isTrustedAiIssue(i) && i.title.startsWith(titlePrefix))
              if (!exists) {
                const body = [
                  '7日以内に価格改定または導入価格終了を迎えるLLMモデルが検出されました。',
                  '',
                  '### 事前警告内容',
                  '```text',
                  auditOutput,
                  '```',
                  '',
                  `- Run URL: ${runUrl}`,
                  '- 対応方法: 該当モデルの公式料金改定内容を確認し、切替タイミングで `src/data/llm-pricing.ts` を更新するPRを準備してください。',
                ].join('\n')
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `${titlePrefix} (${new Date().toISOString().slice(0, 10)})`,
                  body,
                  labels: ['owner:ai', 'type:tool', 'status:ready', 'priority:p1'],
                })
              }
            }

      - name: Fail job if freshness audit failed
        if: steps.freshness.outputs.exit_code != '0'
        run: exit 1
